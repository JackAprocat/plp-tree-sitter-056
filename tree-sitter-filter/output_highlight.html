
<!doctype HTML>
<head>
  <title>Tree-sitter Highlighting</title>
  <style>
    body {
      font-family: monospace
    }
    .line-number {
      user-select: none;
      text-align: right;
      color: rgba(27,31,35,.3);
      padding: 0 10px;
    }
    .line {
      white-space: pre;
    }
  </style>
  <style>
    .attribute { font-style: italic;color: #af0000; }
    .comment { font-style: italic;color: #8a8a8a; }
    .constant { color: #875f00; }
    .constant.builtin { font-weight: bold;color: #875f00; }
    .constructor { color: #af8700; }
    .function { color: #005fd7; }
    .function.builtin { font-weight: bold;color: #005fd7; }
    .keyword { color: #5f00d7; }
    .module { color: #af8700; }
    .number { font-weight: bold;color: #875f00; }
    .operator { font-weight: bold;color: #4e4e4e; }
    .property { color: #af0000; }
    .property.builtin { font-weight: bold;color: #af0000; }
    .punctuation { color: #4e4e4e; }
    .punctuation.bracket { color: #4e4e4e; }
    .punctuation.delimiter { color: #4e4e4e; }
    .punctuation.special { color: #4e4e4e; }
    .string { color: #008700; }
    .string.special { color: #008787; }
    .tag { color: #000087; }
    .type { color: #005f5f; }
    .type.builtin { font-weight: bold;color: #005f5f; }
    .variable { color: #d0d0d0; }
    .variable.builtin { font-weight: bold;color: #d0d0d0; }
    .variable.parameter { text-decoration: underline;color: #d0d0d0; }
  </style>

</head>
<body>

<table>
<tr><td class=line-number>1</td><td class=line><span style='color: #af0000'>status</span> <span style='font-weight: bold;color: #4e4e4e'>=</span> <span style='color: #008700'>&quot;open&quot;</span> <span style='color: #5f00d7'>and</span> <span style='color: #af0000'>priority</span> <span style='font-weight: bold;color: #4e4e4e'>&gt;=</span> <span style='font-weight: bold;color: #875f00'>2</span> <span style='color: #5f00d7'>or</span> <span style='color: #5f00d7'>not</span> <span style='color: #af0000'>archived</span> <span style='font-weight: bold;color: #4e4e4e'>=</span> <span style='font-weight: bold;color: #875f00'>false</span> <span style='color: #5f00d7'>and</span> <span style='color: #af0000'>id</span> <span style='color: #5f00d7'>in</span> (<span style='color: #008700'>&quot;a&quot;</span>, <span style='color: #008700'>&quot;b&quot;</span>, <span style='color: #008700'>&quot;c&quot;</span>) <span style='color: #5f00d7'>and</span> <span style='color: #af0000'>title</span> <span style='color: #5f00d7'>contains</span> <span style='color: #008700'>&quot;invoice&quot;</span>
</td></tr>
</table>

</body>
